<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAZY | INFO</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-hover-border: rgba(99, 102, 241, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --badge-bg: rgba(34, 197, 94, 0.15);
      --badge-text: #4ade80;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f1f5f9 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.9);
      --card-hover-border: rgba(99, 102, 241, 0.4);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.2);
      --badge-bg: rgba(22, 163, 74, 0.12);
      --badge-text: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
      color: var(--text-main);
    }

    
    .container {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    
    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 20px;
    }

    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .action-btn:hover {
      transform: scale(1.08);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Header Profil */
    .profile-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 16px auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px var(--accent-glow);
      border: 3px solid var(--accent);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      margin-bottom: 6px;
    }

    .verified-icon {
      color: #38bdf8;
      font-size: 18px;
    }

    .bio {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 380px;
      margin: 0 auto;
    }

    
    .links-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.25s, box-shadow 0.25s;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: var(--card-hover-border);
      box-shadow: 0 10px 25px var(--accent-glow);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      flex-shrink: 0;
    }

    
    .icon-socialbuzz { background: linear-gradient(135deg, #f58529, #dd2a7b, #9200e7); }
    .icon-tiktok { background: linear-gradient(135deg, #000000, #25f4ee); color: #fff; }
    .icon-wa { background: linear-gradient(135deg, #0ad153, #128c7e); }
    .icon-wa2 { background: linear-gradient(135deg, #000000, #fcfcfc); }

    .link-info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .link-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .click-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(148, 163, 184, 0.12);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .arrow-icon {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .link-card:hover .arrow-icon {
      transform: translateX(4px);
      color: var(--accent);
    }

    
    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-muted);
    }

    
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
    <span>Tautan profil berhasil disalin!</span>
  </div>

  
  <script>
    
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = themeBtn.querySelector('i');
    
    
    const savedTheme = localStorage.getItem('profile-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('profile-theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      if (theme === 'light') {
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        themeIcon.className = 'fa-solid fa-moon';
      }
    }

    
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');

    shareBtn.addEventListener('click', () => {
      const currentUrl = window.location.href;
      navigator.clipboard.writeText(currentUrl).then(() => {
        showToast();
      }).catch(() => {
        
        showToast('Gagal menyalin tautan');
      });
    });

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    
    const linkCards = document.querySelectorAll('.link-card');

    linkCards.forEach(card => {
      const linkId = card.getAttribute('data-link-id');
      const counterSpan = document.getElementById(`count-${linkId}`);
      
      
      let storedClicks = parseInt(localStorage.getItem(`clicks_${linkId}`)) || 0;
      if (counterSpan) {
        counterSpan.innerText = `${storedClicks} klik`;
      }

      
      card.addEventListener('click', () => {
        storedClicks++;
        localStorage.setItem(`clicks_${linkId}`, storedClicks);
        if (counterSpan) {
          counterSpan.innerText = `${storedClicks} klik`;
        }
      });
    });
  </script>
